spring:
  application:
    name: askepedia-backend-test
  datasource:
    url: jdbc:h2:mem:askepedia_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: -1

askepedia:
  wikipedia:
    base-url: "https://en.wikipedia.org/api/rest_v1"
    user-agent: "Askepedia-Test/0.1.0"
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
