spring:
  application:
    name: askepedia-backend-test
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:askepedia}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: -1

askepedia:
  wikipedia:
    base-url: "https://en.wikipedia.org/api/rest_v1"
    user-agent: "Askepedia-Test/0.1.0"
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
